name: UI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Upgrade pip and install Python dependencies
        run: |
          set -ex
          echo "=== Python version ==="
          python --version
          echo "=== Pip version ==="
          pip --version
          echo "=== Installing dependencies from requirements.txt ==="
          python -m pip install --upgrade pip
          pip install -r test_assignment_week4/requirements.txt
          pip install pytest-html
          echo "=== Installed packages ==="
          pip list

      - name: Install Playwright browsers and system deps
        run: |
          set -ex
          echo "=== Installing Playwright browsers ==="
          python -m playwright install --with-deps

      - name: Run tests (Chromium + Firefox via parametrized fixture)
        working-directory: test_assignment_week4
        run: |
          set -ex
          echo "=== STEP: Run tests (Chromium + Firefox via parametrized fixture) ==="
          echo "=== Current command: pytest -vv -n 2 --capture=no --html=report.html --self-contained-html ==="
          pytest -vv -n 2 --capture=no --html=report.html --self-contained-html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: test_assignment_week4/report.html

      - name: Upload screenshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: test_assignment_week4/screenshots
